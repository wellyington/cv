<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — Wellington Almeida</title>
    <script>
      var lang = 'en';
      var params = new URLSearchParams(window.location.search);
      var paramLang = params.get('lang');
      if (paramLang === 'es' || paramLang === 'pt') { lang = paramLang; }
      var stored = localStorage.getItem('wa-portfolio-lang');
      if (stored === 'es' || stored === 'pt') { lang = stored; }
      var langParam = lang !== 'en' ? '?lang=' + lang : '';
      window.location.href = './' + langParam + window.location.hash;
    </script>
    <meta http-equiv="refresh" content="0; url=./" />
    <style>
      body { background:#090a0f; color:#e2e8f0; font-family:ui-monospace,monospace; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
      a { color:#818cf8; text-decoration:none; }
    </style>
  </head>
  <body>
    <p>Redirecting to portfolio… <a href="./">Click here if you are not redirected</a></p>
  </body>
</html>
