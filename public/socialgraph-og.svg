<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="indigoGlow" cx="0%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="emeraldGlow" cx="100%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="monogramBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1" />
    </pattern>

    <!-- Glass Filter Blur -->
    <filter id="cardBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1200" height="630" fill="#090a0f" />

  <!-- Ambient Glows -->
  <rect width="1200" height="630" fill="url(#indigoGlow)" />
  <rect width="1200" height="630" fill="url(#emeraldGlow)" />

  <!-- Background Technical Grid -->
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Decorative Circuit / Mesh Lines -->
  <path d="M 80 470 L 260 470 L 310 520 L 720 520" fill="none" stroke="#6366f1" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="6,6" />
  <circle cx="310" cy="520" r="3" fill="#6366f1" fill-opacity="0.4" />
  <circle cx="720" cy="520" r="3" fill="#10b981" fill-opacity="0.4" />

  <!-- ================= TOP BAR ================= -->
  <!-- Monogram Box -->
  <g transform="translate(80, 75)">
    <!-- Gradient Border -->
    <rect width="52" height="52" rx="12" fill="url(#monogramBorder)" />
    <!-- Inner Fill -->
    <rect x="1.5" y="1.5" width="49" height="49" rx="10.5" fill="#0d0f17" />
    <!-- Text -->
    <text x="26" y="32" font-family="'JetBrains Mono', monospace, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="1">WA</text>
  </g>

  <!-- URL & Status Header -->
  <text x="148" y="93" font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1.5">EXECUTIVE PORTFOLIO // 2026</text>
  <text x="148" y="115" font-family="'JetBrains Mono', monospace, sans-serif" font-size="15" font-weight="500" fill="#e2e8f0">wellyington.github.io/cv</text>

  <!-- Availability Pill Badge -->
  <g transform="translate(770, 76)">
    <rect width="350" height="38" rx="19" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-opacity="0.5" stroke-width="1" />
    <!-- Active Green Node -->
    <circle cx="22" cy="19" r="4" fill="#34d399" />
    <circle cx="22" cy="19" r="8" fill="#34d399" fill-opacity="0.25" />
    <text x="38" y="23" font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" font-weight="500" fill="#6ee7b7">Available for Advisory &amp; CTO Roles</text>
  </g>

  <!-- ================= HERO CORE ================= -->
  <!-- Candidate Name -->
  <text x="80" y="240" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Wellington Almeida</text>

  <!-- Executive Subtitle / Gradient Title -->
  <text x="80" y="292" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="25" font-weight="600" fill="url(#textGradient)" letter-spacing="-0.5">Chief Technology Officer &amp; Polyglot Solutions Architect</text>

  <!-- Architecture Subtitle / Domain Focus -->
  <text x="80" y="348" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" width="850">
    <tspan x="80" dy="0">High-throughput Go microservices, event-driven pipelines, PETAL live architectures,</tspan>
    <tspan x="80" dy="28">and edge-rendered Next.js luxury platforms.</tspan>
  </text>

  <!-- ================= BOTTOM METRICS STRIP ================= -->
  <line x1="80" y1="460" x2="1120" y2="460" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <!-- Metric Badges -->
  <g transform="translate(80, 485)">
    <!-- Metric 1 -->
    <g transform="translate(0, 0)">
      <rect width="185" height="42" rx="8" fill="#1e1b4b" fill-opacity="0.5" stroke="#4338ca" stroke-opacity="0.4" stroke-width="1" />
      <text x="14" y="26" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" font-weight="600" fill="#a5b4fc">⚡ 15+ Years Systems</text>
    </g>

    <!-- Metric 2 -->
    <g transform="translate(200, 0)">
      <rect width="185" height="42" rx="8" fill="#064e3b" fill-opacity="0.4" stroke="#047857" stroke-opacity="0.4" stroke-width="1" />
      <text x="14" y="26" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" font-weight="600" fill="#6ee7b7">🌐 12+ Global Mkts</text>
    </g>

    <!-- Metric 3 -->
    <g transform="translate(400, 0)">
      <rect width="210" height="42" rx="8" fill="#083344" fill-opacity="0.5" stroke="#0e7490" stroke-opacity="0.4" stroke-width="1" />
      <text x="14" y="26" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" font-weight="600" fill="#67e8f9">🚀 &lt;180ms TTFB Edge</text>
    </g>
  </g>

  <!-- Location Label -->
  <text x="1120" y="512" font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="end" letter-spacing="1">ESTEPONA • MARBELLA • SPAIN</text>
</svg>
